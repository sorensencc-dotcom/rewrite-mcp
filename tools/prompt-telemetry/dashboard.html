<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CIC Prompt Telemetry</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@300;400;600;700;800&display=swap');

    :root {
      --black:  #0a0806;
      --forge:  #1a1410;
      --iron:   #2c2420;
      --rust:   #8B3A1A;
      --ember:  #C4501A;
      --brass:  #B8922A;
      --ash:    #9a9088;
      --bone:   #e8e0d4;
      --white:  #faf6f0;
      
      --font-display: 'Playfair Display', serif;
      --font-body: 'Libre Baskerville', serif;
      --font-ui: 'Barlow Condensed', sans-serif;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--black);
      color: var(--bone);
    }
    .grid {
      display: grid;
      grid-template-columns: 2fr 2fr 3fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 12px;
      padding: 12px;
      height: 100vh;
      box-sizing: border-box;
    }
    .panel {
      border: 1px solid var(--iron);
      border-radius: 0;
      padding: 8px;
      background: radial-gradient(circle at top left, var(--forge), var(--black));
      box-shadow: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .panel h2 {
      margin: 0 0 6px 0;
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--brass);
    }
    .panel pre {
      margin: 0;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      line-height: 1.4;
      overflow: auto;
      white-space: pre;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 0;
      font-family: var(--font-ui);
      font-size: 10px;
      margin-right: 4px;
      background: var(--black);
      border: 1px solid var(--ember);
      color: var(--ember);
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-size: 11px;
    }
    .muted {
      color: var(--ash);
    }
    .timeline-event {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 3px;
      font-size: 11px;
      line-height: 1.4;
    }
    .timeline-event .ts { color: var(--ash); flex-shrink: 0; }
    .timeline-event .icon { flex-shrink: 0; width: 14px; text-align: center; }
    .timeline-event .label { color: var(--bone); }
    .timeline-event .label.success { color: #5a9e6f; }
    .timeline-event .label.failed  { color: var(--ember); }
    .timeline-event .label.backoff { color: var(--brass); }
    .timeline-event .label.attempt { color: #66aaff; }
    .timeline-event .agent { color: var(--ash); font-size: 10px; }
    .waterfall { font-size: 11px; }
    .waterfall-event { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    .waterfall-event .bar {
      height: 10px; border-radius: 0; background: var(--ember); flex-shrink: 0;
    }
    .waterfall-event .bar.attempt { background: #66aaff; }
    .waterfall-event .bar.backoff { background: var(--brass); }
    .waterfall-event .bar.success { background: #5a9e6f; }
    .waterfall-event .bar.failed  { background: var(--ember); }
    .waterfall-event .bar { width: calc(var(--bar-w, 20) * 1px); }
    #mas-timeline-panel { grid-column: 1 / 3; }
    .mas-scroll { overflow: auto; flex: 1; }
  </style>
  <script src="../../apps/operator-ui/js/global-nav.js" defer></script>
</head>
<body>
  <div class="grid">
    <div class="panel" id="packs-panel">
      <h2>Packs · Usage</h2>
      <div id="packs-body"></div>
    </div>
    <div class="panel" id="drift-panel">
      <h2>Drift · Recent</h2>
      <pre id="drift-body"></pre>
    </div>
    <div class="panel" id="model-panel">
      <h2>Model Calls · Recent</h2>
      <pre id="model-body"></pre>
    </div>
    <div class="panel" id="pipeline-panel">
      <h2>Pipelines · Recent</h2>
      <pre id="pipeline-body"></pre>
    </div>
    <div class="panel" id="meta-panel">
      <h2>Meta · Status</h2>
      <pre id="meta-body"></pre>
    </div>
    <div class="panel" id="mas-timeline-panel">
      <h2>MAS Intelligence · Timeline</h2>
      <div id="mas-timeline-body" class="mas-scroll"></div>
    </div>
    <div class="panel" id="mas-waterfall-panel">
      <h2>MAS Rerun · Waterfall</h2>
      <div id="mas-waterfall-body" class="mas-scroll"></div>
    </div>
  </div>

  <script>
    const BASE = (location.origin.includes("localhost") || location.origin.includes("127.0.0.1"))
      ? "http://localhost:4310"
      : location.origin;

    async function fetchJson(path) {
      try {
        const res = await fetch(BASE + path);
        if (!res.ok) throw new Error(res.status);
        return await res.json();
      } catch (e) {
        return { error: e.message || String(e) };
      }
    }

    function renderPacks(packs) {
      const el = document.getElementById("packs-body");
      el.innerHTML = "";
      const entries = Object.entries(packs || {}).sort((a, b) => b[1].count - a[1].count);
      entries.forEach(([name, info]) => {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `
          <span><span class="badge">${name}</span>v${info.version}</span>
          <span class="muted">${info.count} calls</span>
        `;
        el.appendChild(row);
      });
      if (!entries.length) {
        el.innerHTML = '<span class="muted">No data yet.</span>';
      }
    }

    function renderList(id, data, maxLines = 40) {
      const el = document.getElementById(id);
      if (!data || data.error) {
        el.textContent = data && data.error ? `error: ${data.error}` : "No data.";
        return;
      }
      const lines = data.slice(0, maxLines).map(d => JSON.stringify(d));
      el.textContent = lines.join("\n");
    }

    function renderMASTimeline(events) {
      const el = document.getElementById("mas-timeline-body");
      el.innerHTML = "";
      const masTypes = new Set(["mas_rerun_attempt", "mas_rerun_backoff", "mas_rerun_final_state", "mas_decision", "mas_signal"]);
      const filtered = (events || []).filter(e => masTypes.has(e.type)).slice(0, 60);
      if (!filtered.length) {
        el.innerHTML = '<span class="muted">No MAS events yet.</span>';
        return;
      }
      filtered.forEach(e => {
        const div = document.createElement("div");
        div.className = "timeline-event";
        const ts = e.ts ? e.ts.slice(11, 19) : "--:--:--";
        let icon, labelText, labelClass;
        switch (e.type) {
          case "mas_rerun_attempt":
            icon = "⚡"; labelText = `!! RERUN attempt #${e.attempt}/${e.maxAttempts} (${e.backoffMs}ms)`; labelClass = "attempt"; break;
          case "mas_rerun_backoff":
            icon = "…"; labelText = `… backoff ${e.backoffMs}ms`; labelClass = "backoff"; break;
          case "mas_rerun_final_state":
            icon = e.finalState === "success" ? "✓" : "✕";
            labelText = e.finalState === "success" ? `✓ rerun success after ${e.attempts} attempt(s)` : `✕ rerun failed (${e.attempts}/${e.maxAttempts})`;
            labelClass = e.finalState === "success" ? "success" : "failed"; break;
          case "mas_decision":
            icon = "▶"; labelText = `decision: ${e.action || e.meta?.action || "?"}`; labelClass = ""; break;
          case "mas_signal":
            icon = "~"; labelText = `signal: ${e.signal || e.meta?.signal || "?"}`; labelClass = ""; break;
          default:
            icon = "·"; labelText = e.type; labelClass = "";
        }
        div.innerHTML = `<span class="ts">${ts}</span><span class="icon">${icon}</span><span class="label ${labelClass}">${labelText}</span><span class="agent">${e.agent || ""}</span>`;
        el.appendChild(div);
      });
    }

    function renderMASWaterfall(events) {
      const el = document.getElementById("mas-waterfall-body");
      el.innerHTML = "";
      const rerunTypes = new Set(["mas_rerun_attempt", "mas_rerun_backoff", "mas_rerun_final_state"]);
      const filtered = (events || []).filter(e => rerunTypes.has(e.type)).slice(0, 40);
      if (!filtered.length) {
        el.innerHTML = '<span class="muted">No rerun events yet.</span>';
        return;
      }
      const maxBackoff = filtered.reduce((m, e) => Math.max(m, e.backoffMs || 0), 1);
      filtered.forEach(e => {
        const div = document.createElement("div");
        div.className = "waterfall-event";
        let barClass, barWidth, label;
        switch (e.type) {
          case "mas_rerun_attempt":
            barClass = "attempt"; barWidth = Math.max(20, Math.round((e.backoffMs || 0) / maxBackoff * 120));
            label = `!! attempt #${e.attempt} — ${e.agent} — ${e.reason || ""}`;
            break;
          case "mas_rerun_backoff":
            barClass = "backoff"; barWidth = Math.max(20, Math.round((e.backoffMs || 0) / maxBackoff * 120));
            label = `… backoff ${e.backoffMs}ms`;
            break;
          case "mas_rerun_final_state":
            barClass = e.finalState === "success" ? "success" : "failed"; barWidth = 40;
            label = e.finalState === "success" ? `✓ success (${e.attempts} attempts)` : `✕ failed (${e.attempts}/${e.maxAttempts})`;
            break;
          default:
            barClass = ""; barWidth = 20; label = e.type;
        }
        div.innerHTML = `<div class="bar ${barClass}" style="--bar-w:${barWidth}"></div><span class="muted">${e.ts ? e.ts.slice(11,19) : ""}</span><span>${label}</span>`;
        el.appendChild(div);
      });
    }

    async function tick() {
      const [packs, drift, modelCalls, pipelines, timeline] = await Promise.all([
        fetchJson("/telemetry/packs"),
        fetchJson("/telemetry/drift"),
        fetchJson("/telemetry/model-calls"),
        fetchJson("/telemetry/pipelines"),
        fetchJson("/telemetry/timeline")
      ]);

      renderPacks(packs);
      renderList("drift-body", drift);
      renderList("model-body", modelCalls);
      renderList("pipeline-body", pipelines);
      renderMASTimeline(timeline);
      renderMASWaterfall(timeline);

      const meta = {
        ts: new Date().toISOString(),
        packs: Object.keys(packs || {}).length,
        driftEvents: (drift || []).length,
        modelCalls: (modelCalls || []).length,
        pipelines: (pipelines || []).length,
        masEvents: Array.isArray(timeline) ? timeline.filter(e => e.type?.startsWith("mas_rerun")).length : 0,
        base: BASE
      };
      document.getElementById("meta-body").textContent = JSON.stringify(meta, null, 2);
    }

    tick();
    setInterval(tick, 3000);
  </script>
</body>
</html>
