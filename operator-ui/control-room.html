<!DOCTYPE html>
<!--
  Control Room — Operator Console
  File: operator-ui/control-room.html | Version: 1.1.0 | Date: 2026-05-16
  Served at: localhost (port configured by server)
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Room — CIC/RewriteLabs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/control-room.css">
</head>
<body>

  <!-- HEADER -->
  <header class="cr-header" role="banner">
    <div class="cr-header__brand">
      <span class="cr-header__mark">◆</span>
      <span class="cr-header__title">CONTROL ROOM</span>
    </div>
    <div class="cr-header__meta">
      <span class="cr-status" id="cr-status">
        <span class="cr-status__dot"></span>
        <span class="cr-status__label">connecting…</span>
      </span>
      <span class="cr-version">v1.1.0</span>
    </div>
  </header>

  <!-- TAB BAR -->
  <nav class="cr-tabs" role="tablist" aria-label="Control plane panels">
    <button class="cr-tab cr-tab--active" role="tab" aria-selected="true"
            aria-controls="pipelines-panel" id="tab-pipelines" data-panel="pipelines-panel">
      Pipelines
    </button>
    <button class="cr-tab" role="tab" aria-selected="false"
            aria-controls="agents-panel" id="tab-agents" data-panel="agents-panel">
      Agents
    </button>
    <button class="cr-tab" role="tab" aria-selected="false"
            aria-controls="runs-panel" id="tab-runs" data-panel="runs-panel">
      Runs
    </button>
    <button class="cr-tab" role="tab" aria-selected="false"
            aria-controls="metrics-panel" id="tab-metrics" data-panel="metrics-panel">
      Metrics
    </button>
    <button class="cr-tab" role="tab" aria-selected="false"
            aria-controls="analyzers-panel" id="tab-analyzers" data-panel="analyzers-panel">
      Analyzers
    </button>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="cr-main" role="main">
    <div id="pipelines-panel" class="cr-panel cr-panel--active"
         role="tabpanel" aria-labelledby="tab-pipelines">
      <div class="cp-loading">Loading…</div>
    </div>
    <div id="agents-panel" class="cr-panel"
         role="tabpanel" aria-labelledby="tab-agents" hidden>
    </div>
    <div id="runs-panel" class="cr-panel"
         role="tabpanel" aria-labelledby="tab-runs" hidden>
    </div>
    <div id="metrics-panel" class="cr-panel"
         role="tabpanel" aria-labelledby="tab-metrics" hidden>
    </div>
    <div id="analyzers-panel" class="cr-panel"
         role="tabpanel" aria-labelledby="tab-analyzers" hidden>
      <!-- Populated by initAnalyzers() on first activation -->
    </div>
  </main>

  <!-- SCRIPTS (ESM, deferred) -->
  <script type="module">
    import { init as initPipelines } from './js/pipelines-panel.js';
    import { init as initAgents }    from './js/agents-panel.js';
    import { init as initRuns }      from './js/runs-panel.js';
    import { init as initMetrics }   from './js/metrics-panel.js';

    // -----------------------------------------------------------------------
    // Analyzers panel — inline init (no separate JS module needed)
    // Polls GET /api/control-plane/analyzers and renders status rows.
    // -----------------------------------------------------------------------
    async function initAnalyzers(el) {
      el.innerHTML = '<div class="cp-loading">Loading analyzer status…</div>';

      const API = '/api/control-plane/analyzers';
      const POLL_INTERVAL_MS = 30_000;

      function renderRow(a) {
        const okClass  = a.ok ? 'az-status--ok' : 'az-status--err';
        const okLabel  = a.ok ? 'ONLINE'        : 'OFFLINE';
        const keyLabel = a.geminiKey ? 'PRESENT' : 'MISSING';
        const keyClass = a.geminiKey ? 'az-key--ok' : 'az-key--missing';
        const err      = a.error ? `<div class="az-error">Error: ${a.error}</div>` : '';
        return `
          <div class="az-row">
            <div class="az-name">${a.name}</div>
            <div class="az-key"><span class="az-key__label">key:</span> ${a.key}</div>
            <div class="az-status ${okClass}">${okLabel}</div>
            <div class="az-gemini ${keyClass}">GEMINI_API_KEY: ${keyLabel}</div>
            <div class="az-detail">${a.detail ?? ''}</div>
            ${err}
          </div>`;
      }

      async function refresh() {
        try {
          const res  = await fetch(API);
          const json = await res.json();
          const analyzers = json?.data?.analyzers ?? [];
          const ts        = json?.data?.timestamp  ?? new Date().toISOString();

          if (analyzers.length === 0) {
            el.innerHTML = '<div class="az-empty">No analyzers registered.</div>';
            return;
          }

          el.innerHTML = `
            <div class="az-header">
              <h2 class="az-title">ANALYZER STATUS</h2>
              <span class="az-ts">Last checked: ${ts}</span>
            </div>
            <div class="az-list">
              ${analyzers.map(renderRow).join('')}
            </div>`;
        } catch (err) {
          el.innerHTML = `<div class="az-error-block">Failed to load analyzer status: ${err.message}</div>`;
        }
      }

      await refresh();
      setInterval(refresh, POLL_INTERVAL_MS);
    }

    // -----------------------------------------------------------------------
    // Panel registry — maps panel ID → init function + initialized flag
    // -----------------------------------------------------------------------
    const PANELS = {
      'pipelines-panel': { init: initPipelines,  ready: false },
      'agents-panel':    { init: initAgents,      ready: false },
      'runs-panel':      { init: initRuns,         ready: false },
      'metrics-panel':   { init: initMetrics,     ready: false },
      'analyzers-panel': { init: initAnalyzers,   ready: false },
    };

    // -----------------------------------------------------------------------
    // Tab switching
    // -----------------------------------------------------------------------
    function activatePanel(panelId) {
      // Tabs
      document.querySelectorAll('.cr-tab').forEach(tab => {
        const active = tab.dataset.panel === panelId;
        tab.classList.toggle('cr-tab--active', active);
        tab.setAttribute('aria-selected', active ? 'true' : 'false');
      });

      // Panels
      document.querySelectorAll('.cr-panel').forEach(panel => {
        const active = panel.id === panelId;
        panel.classList.toggle('cr-panel--active', active);
        panel.hidden = !active;
      });

      // Lazy-init: only init a panel the first time it becomes visible
      const entry = PANELS[panelId];
      if (entry && !entry.ready) {
        const el = document.getElementById(panelId);
        if (el) {
          entry.init(el);
          entry.ready = true;
        }
      }
    }

    document.querySelectorAll('.cr-tab').forEach(tab => {
      tab.addEventListener('click', () => activatePanel(tab.dataset.panel));
    });

    // Keyboard navigation on tab bar
    document.querySelector('.cr-tabs').addEventListener('keydown', e => {
      const tabs = [...document.querySelectorAll('.cr-tab')];
      const idx = tabs.indexOf(document.activeElement);
      if (e.key === 'ArrowRight') { tabs[(idx + 1) % tabs.length].focus(); e.preventDefault(); }
      if (e.key === 'ArrowLeft')  { tabs[(idx - 1 + tabs.length) % tabs.length].focus(); e.preventDefault(); }
      if (e.key === 'Enter' || e.key === ' ') { document.activeElement.click(); e.preventDefault(); }
    });

    // -----------------------------------------------------------------------
    // Status probe — polls /api/control-plane/pipelines to confirm API is live
    // -----------------------------------------------------------------------
    const statusDot   = document.querySelector('.cr-status__dot');
    const statusLabel = document.querySelector('.cr-status__label');

    async function probeStatus() {
      try {
        const res = await fetch('/api/control-plane/pipelines');
        if (res.ok) {
          statusDot.classList.remove('cr-status__dot--err');
          statusDot.classList.add('cr-status__dot--ok');
          statusLabel.textContent = 'LIVE';
        } else {
          throw new Error(res.status);
        }
      } catch (_) {
        statusDot.classList.remove('cr-status__dot--ok');
        statusDot.classList.add('cr-status__dot--err');
        statusLabel.textContent = 'OFFLINE';
      }
    }

    probeStatus();
    setInterval(probeStatus, 30_000);

    // -----------------------------------------------------------------------
    // Boot: init the default panel (Pipelines)
    // -----------------------------------------------------------------------
    activatePanel('pipelines-panel');
  </script>
</body>
</html>
