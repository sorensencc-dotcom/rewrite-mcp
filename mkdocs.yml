site_name: Rewrite Labs Documentation
site_url: https://rewrite-docs.yourdomain.com
repo_url: https://github.com/sorensencc-dotcom/rewrite-mcp
repo_name: rewrite-mcp

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
  font:
    text: Libre Baskerville
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Manuals:
      - Ops Console: manuals/ops_console.md
      - Metrics & Health: manuals/metrics_health.md
      - Replay Engine: manuals/replay_engine.md
      - Event Logging (Black Box): manuals/event_logging.md
      - Dry-Run Mode: manuals/dry_run.md
      - Daily Digest: manuals/daily_digest.md
      - Idea Clusterer: manuals/ideas_clusterer.md
      - Task Extractor: manuals/task_extractor.md
      - Master Instructions (v1.2): manuals/master-instructions-manual/v1.2/manual.md
      - Master Instructions (v1.1): manuals/master-instructions-manual/v1.1/manual.md
  - Roadmaps:
      - Master Roadmap: roadmaps/master-roadmap/v1.1/roadmap.md
      - Active Roadmap: ROADMAP.md
  - Playbooks:
      - Outreach Automation: playbooks/outreach-automation/v1.0/playbook.md
  - Governance:
      - Foundational Mandate: ANTIGRAVITY.md
      - Documentation Policy: DOC_POLICY.md
      - Versioning: VERSIONING.md
      - SLO Charter: ANTIGRAVITY_SLO.md
      - Changelog: CHANGELOG.md
  - Architecture:
      - System Overview: architecture/system-overview.md
      - Control Plane: architecture/control-plane-design.md
      - SLO Dashboard: architecture/slo-dashboard-spec.md
      - Prompt Management: architecture/pms.md
      - Pipeline: architecture/pipeline.md
      - Agents: architecture/agents.md
      - Telemetry: architecture/telemetry.md
  - Project (CIC):
      - Index: projects/cic/cic-docs-index.md
      - Master Roadmap: projects/cic/cic-master-roadmap.md
      - Master Spec: projects/cic/cic-master-spec.md
      - Labs Roadmap: projects/cic/rewrite-labs-roadmap.md
  - Tools:
      - Runtime Harness: tools/runtime-harness.md
      - Prompt Telemetry: tools/prompt-telemetry.md
  - State:
      - Rewrite Labs State: state/rewrite-labs-state.md
  - Migrations:
      - Antigravity 2.0: migrations/antigravity.md
  - Releases:
      - Phase 25 (Antigravity): releases/phase-25-antigravity.md
      - v2.8.0 (Latest): releases/2.8.0.md
  - Readiness:
      - Phase 26: readiness/phase-26.md
      - Phase 26 Mandate: readiness/phase-26-mandate.md
      - Phase 27: readiness/phase-27-mandate.md

plugins:
  - search
  - mike

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_css:
  - css/charlie-theme.css

extra_javascript:
  - ../apps/operator-ui/js/global-nav.js
