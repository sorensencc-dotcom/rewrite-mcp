site_name: Rewrite Labs Documentation
site_url: https://rewrite-docs.yourdomain.com
repo_url: https://github.com/sorensencc-dotcom/rewrite-mcp
repo_name: rewrite-mcp

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
  font:
    text: Libre Baskerville
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
