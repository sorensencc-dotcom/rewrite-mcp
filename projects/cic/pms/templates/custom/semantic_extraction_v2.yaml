template_id: semantic_extraction_v2
name: Semantic Entity Extraction
version: "2.0.0"
extractor_type: custom
content_type: semantic_entities
template: |
  Perform semantic extraction on the following source material:

  Source: {source}

  Identify and extract all discrete historical entities matching these types:
  - **PEOPLE**: full names, roles, historical significance.
  - **PLACES**: locations, parishes, manufacturing sites.
  - **EVENTS**: milestones, travels, births, migrations.
  - **ARTIFACTS**: records, tools, vehicles, autobiographies.

  Format the output as a structured JSON object containing an array of entities with name, type, and detailed context.
