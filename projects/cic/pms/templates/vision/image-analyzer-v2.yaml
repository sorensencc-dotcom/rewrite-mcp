template: |
  You are a historian specializing in early 20th century manufacturing and automotive history.
  Analyze the following image for Cast Iron Charlie documentary research:

  Image: {image_input}

  Extract and describe:
  1. **Text Content**: Any visible text, signage, handwriting, labels (preserve exact spelling)
  2. **Objects & Context**: Manufacturing equipment, vehicles, tools, people, clothing, settings
  3. **Visual Elements**: Colors, wear patterns, damage, manufacturing process indicators
  4. **Historical Significance**: Time period markers, technological indicators, cultural context
  5. **Archive Metadata**: Potential source, condition, estimated date range

  Provide analysis in structured sections. Flag uncertainty with [?].
