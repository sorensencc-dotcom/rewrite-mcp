<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIC Headroom Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(22, 28, 45, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-primary: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 10% 20%, rgba(22, 28, 45, 0.5) 0%, rgba(11, 15, 25, 1) 90%);
            color: var(--text-color);
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        header {
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 400;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
        }

        .panel:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.45);
        }

        .panel-full {
            grid-column: 1 / -1;
        }

        .panel-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.95rem;
        }

        .metric:last-of-type {
            border-bottom: none;
        }

        .metric span {
            font-weight: 500;
        }

        .rule-badge {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            border: 1px solid rgba(59, 130, 246, 0.3);
            font-family: monospace;
        }

        .log-container {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .log-item {
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            display: flex;
            gap: 10px;
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .log-time {
            color: var(--text-muted);
        }

        .log-rule {
            color: #f59e0b;
        }

        .no-logs {
            color: var(--text-muted);
            text-align: center;
            padding: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>CIC Headroom Control Center</h1>
            <div class="subtitle">Real-time Policy Evaluation & Auto-Tuning Dashboard</div>
        </header>

        <div class="dashboard-grid">
            <div id="panel-system" class="panel">
                <div class="panel-title">System Status</div>
                <div class="metric">Service State: <span style="color: #10b981; font-weight: bold;">OPERATIONAL</span></div>
                <div class="metric">Environment: <span>Production</span></div>
                <div class="metric">Telemetry Polling: <span style="color: #60a5fa;">Active</span></div>
            </div>

            <div id="panel-headroom" class="panel">
                <div class="panel-title">Headroom Subsystem</div>
                <div class="no-logs">Loading telemetry data...</div>
            </div>

            <div id="panel-headroom-policy" class="panel panel-full">
                <div class="panel-title">Policy Engine</div>
                <div class="no-logs">Loading policy state...</div>
            </div>
        </div>
    </div>
    
    <script type="module" src="dashboard.js"></script>
</body>
</html>
