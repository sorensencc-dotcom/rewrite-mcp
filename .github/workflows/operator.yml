name: Operator deterministic run
on:
  push:
    paths:
      - 'docs/**'
      - 'skills/**'
jobs:
  deterministic:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic plan validation
        run: npm run doc:drift && npm run test:rewrite-labs
