name: Operator deterministic run
on:
  push:
    paths:
      - 'docs/**'
      - 'skills/**'
jobs:
  deterministic:
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic plan validation
        run: npm run doc:version-check && npm test --silent
