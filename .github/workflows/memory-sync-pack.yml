name: Memory Sync Pack Export

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build AI-OS
        run: |
          cd apps/ai-os
          npx tsc

      - name: Run AI-OS Export Pipeline
        run: |
          # We need a runner script that works in CI
          cat <<EOF > apps/ai-os/ci-runner.js
          const { runPipeline } = require("./dist/orchestrator.js");
          const path = require("node:path");
          const root = path.join(__dirname, "../..");
          runPipeline(root).catch(err => {
              console.error(err);
              process.exit(1);
          });
          EOF
          node apps/ai-os/ci-runner.js

      - name: Upload Memory Sync Pack Artifact
        uses: actions/upload-artifact@v4
        with:
          name: memory-sync-pack
          path: EXPORT/memory_sync_pack_v*.tar.gz
          if-no-files-found: error

      - name: Release Note
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Memory Sync Pack v${{ github.ref_name }} packaged and verified."
