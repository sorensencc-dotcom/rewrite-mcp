<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Console — Phase 44</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; background: #0d1117; color: #e6edf3; }

    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .header { border-bottom: 1px solid #30363d; padding-bottom: 20px; margin-bottom: 20px; }
    h1 { font-size: 32px; margin-bottom: 5px; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .status-healthy { background: #238636; }
    .status-degraded { background: #d29922; }
    .status-critical { background: #da3633; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .grid.full { grid-template-columns: 1fr; }

    .panel { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 20px; }
    .panel-title { font-size: 14px; font-weight: 600; color: #79c0ff; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }

    .workflow-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .workflow-btn { padding: 12px 16px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .workflow-btn:hover { border-color: #58a6ff; background: #0d1117; }
    .workflow-btn.active { background: #238636; border-color: #238636; }

    .input-group { margin-bottom: 15px; }
    .input-label { display: block; font-size: 12px; margin-bottom: 5px; color: #79c0ff; }
    .input-field { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-family: monospace; font-size: 13px; }
    .input-field:focus { outline: none; border-color: #58a6ff; box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2); }

    .run-button { padding: 12px 24px; background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s; }
    .run-button:hover { background: #2ea043; }
    .run-button:disabled { opacity: 0.5; cursor: not-allowed; }

    .output-tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #30363d; }
    .output-tab { padding: 10px 15px; border: none; background: none; color: #79c0ff; cursor: pointer; font-size: 13px; border-bottom: 2px solid transparent; }
    .output-tab.active { border-bottom-color: #238636; }

    .output-content { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 15px; font-family: monospace; font-size: 12px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
    .output-error { color: #f85149; }
    .output-success { color: #3fb950; }

    .status-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .status-item { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; }
    .status-label { font-size: 11px; color: #8b949e; text-transform: uppercase; }
    .status-value { font-size: 18px; font-weight: 600; color: #79c0ff; margin-top: 5px; }

    .loading { display: inline-block; width: 4px; height: 4px; background: #79c0ff; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    .alert { padding: 12px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; }
    .alert-error { background: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid rgba(248, 81, 73, 0.3); }
    .alert-warning { background: rgba(210, 153, 34, 0.15); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.3); }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>Operator Console</h1>
      <div style="margin-top: 10px; font-size: 13px; color: #8b949e;">
        Phase 44 — CIC/MEE/RL Operations
        <span class="status-badge status-healthy" id="statusBadge">Healthy</span>
      </div>
    </div>

    <div class="grid full">
      <!-- Workflow Selector -->
      <div class="panel">
        <div class="panel-title">Select Workflow</div>
        <div class="workflow-selector">
          <button class="workflow-btn active" data-workflow="phase-summary-roadmap">
            Phase Summary
          </button>
          <button class="workflow-btn" data-workflow="environment-check-procedure">
            Environment Check
          </button>
          <button class="workflow-btn" data-workflow="pipeline-orchestration-dashboard">
            Pipeline Status
          </button>
        </div>
      </div>
    </div>

    <div class="grid">
      <!-- Inputs Panel -->
      <div class="panel">
        <div class="panel-title">Workflow Inputs</div>
        <div id="inputPanel"></div>
        <button class="run-button" id="runButton">Run Workflow</button>
      </div>

      <!-- Status Panel -->
      <div class="panel">
        <div class="panel-title">System Status</div>
        <div class="status-grid" id="statusPanel">
          <div class="status-item">
            <div class="status-label">Phase Progress</div>
            <div class="status-value" id="phaseProgress">--</div>
          </div>
          <div class="status-item">
            <div class="status-label">Environment</div>
            <div class="status-value" id="envStatus">--</div>
          </div>
          <div class="status-item">
            <div class="status-label">Pipeline Health</div>
            <div class="status-value" id="pipelineHealth">--</div>
          </div>
          <div class="status-item">
            <div class="status-label">Overall</div>
            <div class="status-value" id="overallHealth">--</div>
          </div>
        </div>
      </div>
    </div>

    <div class="grid full">
      <!-- Output Panel -->
      <div class="panel">
        <div class="panel-title">Workflow Output</div>
        <div class="output-tabs">
          <button class="output-tab active" data-tab="result">Result</button>
          <button class="output-tab" data-tab="telemetry">Telemetry</button>
          <button class="output-tab" data-tab="alerts">Alerts</button>
        </div>
        <div class="output-content" id="outputPanel">Ready to run workflow...</div>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
