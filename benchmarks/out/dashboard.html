<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rewrite Labs Benchmark Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #f5f5f5;
        padding: 32px 16px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 8px;
        color: #1a1a1a;
      }

      .timestamp {
        font-size: 14px;
        color: #666;
        margin-bottom: 24px;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      thead {
        background: #f0f0f0;
        border-bottom: 1px solid #ddd;
      }

      th {
        padding: 12px 16px;
        text-align: left;
        font-weight: 600;
        font-size: 14px;
        color: #333;
      }

      td {
        padding: 12px 16px;
        border-bottom: 1px solid #eee;
        font-size: 14px;
      }

      tr:last-child td {
        border-bottom: none;
      }

      .status-ok {
        color: #0a0;
        font-weight: 600;
      }

      .status-fail {
        color: #a00;
        font-weight: 600;
      }

      .status-missing {
        color: #999;
        font-weight: 500;
      }

      .site-id {
        font-family: monospace;
        font-size: 13px;
      }

      .summary {
        margin-top: 24px;
        padding: 16px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .summary-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .summary-row:last-child {
        margin-bottom: 0;
      }

      .summary-label {
        color: #666;
      }

      .summary-value {
        font-weight: 600;
        color: #1a1a1a;
      }

      .error {
        color: #a00;
        padding: 16px;
        background: #fee;
        border-radius: 8px;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Rewrite Labs Benchmark Dashboard</h1>
      <div class="timestamp" id="timestamp"></div>

      <table>
        <thead>
          <tr>
            <th>Site</th>
            <th>Rewrite</th>
            <th>Render</th>
            <th>Screenshot-to-Code</th>
            <th>Metadata</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>

      <div class="summary">
        <div class="summary-row">
          <span class="summary-label">Total sites</span>
          <span class="summary-value" id="total">0</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">All green</span>
          <span class="summary-value" id="all-green">0</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Missing snapshots</span>
          <span class="summary-value" id="missing">0</span>
        </div>
      </div>

      <div id="error" class="error" style="display: none;"></div>
    </div>

    <script>
      const today = new Date().toLocaleDateString("en-US", {
        year: "numeric",
        month: "long",
        day: "numeric",
      });
      document.getElementById("timestamp").textContent = `Last updated: ${today}`;

      function renderStatus(ok) {
        if (ok === null || ok === undefined) {
          return `<span class="status-missing">MISSING</span>`;
        }
        return ok
          ? `<span class="status-ok">✓</span>`
          : `<span class="status-fail">✗</span>`;
      }

      fetch("status.json")
        .then((r) => {
          if (!r.ok) throw new Error(`Status: ${r.status}`);
          return r.json();
        })
        .then((data) => {
          const tbody = document.getElementById("rows");
          let allGreen = 0;
          let missing = 0;

          data.forEach((row) => {
            const tr = document.createElement("tr");

            const idTd = document.createElement("td");
            idTd.className = "site-id";
            idTd.textContent = row.id;
            tr.appendChild(idTd);

            const rewrite = document.createElement("td");
            rewrite.innerHTML = renderStatus(row.rewrite);
            tr.appendChild(rewrite);

            const render = document.createElement("td");
            render.innerHTML = renderStatus(row.render);
            tr.appendChild(render);

            const stc = document.createElement("td");
            stc.innerHTML = renderStatus(row.stc);
            tr.appendChild(stc);

            const metadata = document.createElement("td");
            metadata.innerHTML = renderStatus(row.metadata);
            tr.appendChild(metadata);

            tbody.appendChild(tr);

            if (row.rewrite && row.render && row.stc && row.metadata) {
              allGreen++;
            }

            if (!row.rewrite || !row.render || !row.stc || !row.metadata) {
              missing++;
            }
          });

          document.getElementById("total").textContent = data.length;
          document.getElementById("all-green").textContent = allGreen;
          document.getElementById("missing").textContent = missing;
        })
        .catch((err) => {
          const errorDiv = document.getElementById("error");
          errorDiv.style.display = "block";
          errorDiv.textContent = `Error loading status: ${err.message}`;
        });
    </script>
  </body>
</html>
